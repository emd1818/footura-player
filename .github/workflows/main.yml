name: FOOTURA Football Trials Daily Update

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

concurrency:
  group: footura-trials-daily
  cancel-in-progress: false

jobs:
  update-trials:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify crawler
        run: |
          test -f crawler/crawl_trials.py
          echo "Crawler found."

      - name: Install dependencies
        run: |
          if [ -f crawler/requirements.txt ]; then
            python -m pip install -r crawler/requirements.txt
          fi

      - name: Run football trials crawler
        run: python crawler/crawl_trials.py

      - name: Update database
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_database.py
