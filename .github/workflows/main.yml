name: FOOTURA Football Trials Daily Update

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

jobs:
  update-trials:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify crawler
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== CRAWLER ==="
          ls -la crawler
          echo "=== CRAWLER FILE ==="
          test -f crawler/crawl_trials.py
          echo "OK: crawler/crawl_trials.py exists"

      - name: Install dependencies
        run: |
          if [ -f crawler/requirements.txt ]; then
            pip install -r crawler/requirements.txt
          fi

      - name: Run football trials crawler
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python crawler/crawl_trials.py
      - name: Save updated database
        run: |
          git config user.name "FOOTURA Trials Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/football_trials.json

          if git diff --cached --quiet; then
            echo "No database changes."
            exit 0
          fi

          git commit -m "Update football trials database"

          git pull --rebase origin main
          git push origin main
