name: FOOTURA Football Trials Daily Update

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

concurrency:
  group: footura-trials-daily
  cancel-in-progress: false

jobs:
  update-trials:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify crawler
        run: |
          test -f crawler/crawl_trials.py
          echo "OK: crawler/crawl_trials.py exists"

      - name: Install dependencies
        run: |
          if [ -f crawler/requirements.txt ]; then
            python -m pip install -r crawler/requirements.txt
          fi

      - name: Run football trials crawler
        run: |
          python crawler/crawl_trials.py

      - name: Save updated database
        run: |
          git config user.name "FOOTURA Trials Bot"
          git config user.email "actions@users.noreply.github.com"

          git fetch origin main
          git rebase origin/main

          git add data/football_trials.json

          if git diff --cached --quiet; then
            echo "No database changes."
            exit 0
          fi

          git commit -m "Update football trials database"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Database successfully pushed."
              exit 0
            fi

            echo "Push failed. Refreshing main and retrying..."
            git fetch origin main
            git rebase origin/main
          done

          echo "ERROR: Could not push database after 3 attempts."
          exit 1

